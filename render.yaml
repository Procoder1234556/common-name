# Common Name — Render Blueprint (Phase 6+)
# Paid plan + persistent disk for OGD SQLite (Context7: free has no disks).
# Build: ingest public Goa OGD fixture + bake seed; start copies seed onto empty disk.
# Never scrapes MCA. Full nationwide OGD: operator uploads larger sqlite to /var/data.

services:
  - type: web
    name: common-name
    runtime: node
    plan: starter
    region: oregon
    healthCheckPath: /api/health
    buildCommand: HUSKY=0 pnpm install --frozen-lockfile && pnpm db:ogd-goa && pnpm db:seed-artifact && pnpm build
    startCommand: pnpm start
    disk:
      name: company-index
      mountPath: /var/data
      sizeGB: 10
    envVars:
      - key: NODE_VERSION
        value: "22.14.0"
      - key: NODE_ENV
        value: production
      - key: CONFIRM_OGD_DOWNLOAD
        value: "no"
      - key: COMPANIES_DB_DRIVER
        value: sqljs
      - key: COMPANIES_DB_PATH
        value: /var/data/companies.sqlite
      - key: COMPANIES_DB_SEED
        value: ./data/companies.sqlite.seed
      - key: RATE_LIMIT_WINDOW_MS
        value: "900000"
      - key: RATE_LIMIT_MAX
        value: "30"
      - key: NEXT_PUBLIC_MCA_VERIFY_URL
        value: https://www.mca.gov.in/
      - key: NEXT_PUBLIC_OGD_CATALOG_URL
        value: https://data.gov.in/catalog/company-master-data
      - key: NEXT_PUBLIC_APP_URL
        value: https://common-name.onrender.com
